name: mind_feed
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  animated_text_kit: ^4.3.0
  bloc: ^9.0.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  data_connection_checker_tv: ^0.3.5-nullsafety
  dio: ^5.9.0
  equatable: ^3.0.0
  expandable: ^5.0.1
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_advanced_drawer: ^1.5.0
  flutter_animate_on_scroll: ^0.3.0
  flutter_bloc: ^9.1.1
  flutter_localization: ^0.3.3
  flutter_markdown_plus: ^1.0.12
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.0
  get_it: ^8.2.0
  google_fonts: ^8.2.1
  google_nav_bar: ^5.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  line_icons: ^2.0.3
  logger: ^2.6.1
  modal_progress_hud_nsn: ^0.5.1
  shared_preferences: ^2.5.3
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.18.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utls/
  filename: app_images.dart

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MindFeedLogo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/MindFeedLogo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
