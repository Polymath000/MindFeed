name: build-apk
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/build-apk.yml
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      dart_defines:
        description: >-
          Optional space-separated KEY=VALUE pairs passed as --dart-define.
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          cache: true
      - name: Toolchain versions
        run: |
          java -version
          flutter --version
      - name: Pub get
        run: flutter pub get
      - name: Build Android APKs
        env:
          DART_DEFINES: ${{ inputs.dart_defines }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${SECRET_SUPABASE_URL:-}" ]]; then
            args+=("--dart-define=PROJECT_URL=${SECRET_SUPABASE_URL}")
            args+=("--dart-define=SUPABASE_URL=${SECRET_SUPABASE_URL}")
          fi
          if [[ -n "${SECRET_SUPABASE_KEY:-}" ]]; then
            args+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=${SECRET_SUPABASE_KEY}")
          fi
          read -r -a pairs <<< "${DART_DEFINES:-}"
          for pair in ${pairs[@]+"${pairs[@]}"}; do
            if [[ -n "$pair" ]]; then
              if [[ ! "$pair" =~ ^[A-Z][A-Z0-9_]*=.+$ ]]; then
                echo "::error::Invalid dart define '${pair%%=*}': expected KEY=VALUE with an upper-case key."
                exit 1
              fi
              args+=("--dart-define=$pair")
            fi
          done

          echo "Building universal APK..."
          flutter build apk --release ${args[@]+"${args[@]}"}

          echo "Building split-per-abi APKs..."
          flutter build apk --release --split-per-abi ${args[@]+"${args[@]}"}

      - name: Stage APK outputs
        id: stage_apks
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          output_dir="build/release-apks"
          mkdir -p "$output_dir"

          cp build/app/outputs/flutter-apk/app-release.apk "$output_dir/MindFeed-v${VERSION}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$output_dir/MindFeed-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$output_dir/MindFeed-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$output_dir/MindFeed-v${VERSION}-x86_64.apk"

          ls -lh "$output_dir"
          echo "apk_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/release-apks/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APKs to GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="Release ${TAG}"
            PRERELEASE_FLAG=""
          else
            TAG="v${VERSION}-${BUILD}-${SHORT_SHA}"
            TITLE="MindFeed v${VERSION}+${BUILD} (${SHORT_SHA})"
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "Releasing to tag: $TAG with title: $TITLE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              ${PRERELEASE_FLAG} || true
          fi
          gh release upload "$TAG" build/release-apks/*.apk --clobber
